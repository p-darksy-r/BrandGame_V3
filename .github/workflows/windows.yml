name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        shell: powershell
        run: |
          npm ci --ignore-scripts --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test.ps1
      - name: Offline browser playthrough
        shell: powershell
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:e2e
      - name: Publish
        shell: powershell
        run: ./scripts/build.ps1 -SigningMode None
      - name: Package
        shell: powershell
        run: ./scripts/package.ps1 -AllowUnsigned
      - uses: actions/upload-artifact@v4
        with:
          name: BrandGame-Windows-Unsigned-CI
          path: |
            artifacts/packages/*
            update.exe
